<div class="profile">
  <h1>Perfil</h1>

  @if (!auth.ready()) {
    <p class="muted">Carregando...</p>
  } @else if (auth.user(); as user) {
    <section class="card">
      @if (user.photoURL) {
        <img class="avatar" [src]="user.photoURL" [alt]="user.displayName || 'Foto do perfil'" referrerpolicy="no-referrer" />
      } @else {
        <span class="avatar initial">{{ initial(user.displayName, user.email) }}</span>
      }
      <div>
        <h2>{{ user.displayName || 'Sem nome' }}</h2>
        <p class="muted">{{ user.email }}</p>
      </div>
    </section>

    <p class="status">
      <span class="dot"></span> Você está logado
    </p>

    <button type="button" class="signout" (click)="signOut()">Sair</button>
  } @else {
    <section class="card empty">
      <p>Você não está logado.</p>
      <a class="signin" routerLink="/entrar">Entrar</a>
    </section>
  }
</div>
