<div
  class="frame"
  [class.dragging]="dragging()"
  tabindex="0"
  role="group"
  aria-label="Enquadramento da foto. Use as setas do teclado para mover."
  (pointerdown)="onDown($event)"
  (pointermove)="onMove($event, photo)"
  (pointerup)="onUp()"
  (pointercancel)="onUp()"
  (keydown)="onKey($event)"
>
  <img #photo [src]="src()" alt="Foto" draggable="false" [style.object-position]="position() | focus" />
  <span class="hint">Arraste para ajustar</span>
  <!-- stopPropagation: pressing the button must not start a drag of the photo -->
  <button
    type="button"
    class="center"
    aria-label="Centralizar foto"
    title="Centralizar"
    (pointerdown)="$event.stopPropagation()"
    (click)="reset()"
  >
    <mat-icon>my_location</mat-icon>
  </button>
</div>

<div class="previews">
  <div class="preview-item">
    <img class="circle" [src]="src()" alt="" [style.object-position]="position() | focus" />
    <span>Mensagens</span>
  </div>
  <div class="preview-item">
    <img class="card" [src]="src()" alt="" [style.object-position]="position() | focus" />
    <span>Card</span>
  </div>
  <div class="preview-item grow">
    <img class="strip" [src]="src()" alt="" [style.object-position]="position() | focus" />
    <span>Topo da página</span>
  </div>
</div>
