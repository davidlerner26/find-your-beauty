[build]
  command = "npm run build"
  publish = "dist/find-your-beauty/browser"

# Two environments, one site: the branch `main` is production (findyourbeauty.com.br) and uses the Firebase project of
# production. Every other branch (develop = dev.findyourbeauty.com.br) and the deploy previews are builds of the test
# environment: another Firebase project, a banner and a robots.txt that blocks search engines (see docs/ambientes.md).
[context.production]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build:dev"

[context.deploy-preview]
  command = "npm run build:dev"

[build.environment]
  NODE_VERSION = "22"
  # Browser keys (Firebase web apiKey and Google Maps key) are public by design: they have to be in
  # the bundle. What protects them is the Firestore/Storage rules and the HTTP referrer restriction
  # in Google Cloud, so the secrets scanner is told to ignore these two values.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB41b9p2_dNiCulzT_jafIeindOFuDcI-I,AIzaSyBGcq0sRf1RW7h4v9M-ZU-hR2RYstQnUzM"

# The app is a single page app, built once per language: Portuguese at the root, English under /en and Spanish under /es.
# Every route of a language is served by the index.html of that language (the order matters: the first match wins)
[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/es/*"
  to = "/es/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and its list of files must always be fresh, or an old version of the app would stay installed
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/es/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/es/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/es/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
