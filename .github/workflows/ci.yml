name: CI

# Everything that has to be true before a change is merged. Netlify builds and publishes the site; this only checks.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, unit tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions

      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: The Cloud Functions copy of the shared code is up to date
        run: npm run check:shared
      - name: Cloud Functions compile
        run: npm run build --prefix functions
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Build (production)
        run: npm run build
      - name: Build (test environment)
        run: npm run build:dev

  emulators:
    name: Rules, functions and end to end tests (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The emulators need Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Security rules
        run: npm run test:rules
      - name: Cloud Functions
        run: npm run test:functions
      - name: Browsers
        run: npx playwright install --with-deps chromium
      - name: End to end
        run: npm run e2e
        env:
          CI: 'true'
      - name: Report of the end to end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
