<div class="screen" [class.with-tabs]="showTabs">
  <router-outlet />
</div>

@if (showTabs) {
  <nav class="tabs">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" [class.active]="isActive(tab)" [attr.aria-label]="tab.label">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path [attr.d]="tab.icon" /></svg>
          @if (tab.badge) {
            <span class="badge"></span>
          }
        </span>
        <span class="dot"></span>
      </a>
    }
  </nav>
}
