[build]
  command = "node scripts/netlify-build.cjs"
  publish = "dist/find-your-beauty/browser"

# Two environments with the same code. The build picks one by the branch (scripts/netlify-build.cjs): `main` is
# production (findyourbeauty.com.br, Firebase project of production) and any other branch (develop =
# dev.findyourbeauty.com.br), or deploy preview, is the test environment: another Firebase project, a banner and a
# robots.txt that blocks search engines (see docs/ambientes.md). It works on one site with branch deploys or on two
# sites of the same repository (the second one with `develop` as its production branch).

[build.environment]
  NODE_VERSION = "22"
  # Browser keys (Firebase web apiKey and Google Maps key) are public by design: they have to be in
  # the bundle. What protects them is the Firestore/Storage rules and the HTTP referrer restriction
  # in Google Cloud, so the secrets scanner is told to ignore these two values.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB41b9p2_dNiCulzT_jafIeindOFuDcI-I,AIzaSyBGcq0sRf1RW7h4v9M-ZU-hR2RYstQnUzM,AIzaSyBwamplQdQ7d2BYMuD56DfVigkO1fuSpEw"

# The app is a single page app, built once per language: Portuguese at the root, English under /en and Spanish under /es.
# Every route of a language is served by the index.html of that language (the order matters: the first match wins)
[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/es/*"
  to = "/es/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and its list of files must always be fresh, or an old version of the app would stay installed
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/es/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/es/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/es/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
