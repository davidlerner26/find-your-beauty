<div class="picker">
  <div class="month">
    <button
      i18n-aria-label
      type="button"
      aria-label="Mês anterior"
      [disabled]="!canGoBack()"
      (click)="changeMonth(-1)"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>
    <strong>{{ monthLabel() }}</strong>
    <button i18n-aria-label type="button" aria-label="Próximo mês" (click)="changeMonth(1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="grid">
    @for (weekday of weekdays; track $index) {
      <span class="weekday">{{ weekday }}</span>
    }
    @for (cell of cells(); track $index) {
      @if (cell) {
        <button
          type="button"
          class="cell"
          [class.blocked]="!!blockedBand(cell.key)"
          [class.blocked-first]="blockedBand(cell.key)?.first"
          [class.blocked-last]="blockedBand(cell.key)?.last"
          [class.in-range]="inRange(cell.key)"
          [class.edge]="isStart(cell.key) || isEnd(cell.key)"
          [class.start]="isStart(cell.key) && range().end"
          [class.end]="isEnd(cell.key) && range().end"
          [disabled]="cell.disabled || !!blockedBand(cell.key)"
          (click)="pick(cell.key)"
        >
          {{ cell.day }}
        </button>
      } @else {
        <span></span>
      }
    }
  </div>

  @if (blocked().length) {
    <p i18n class="legend"><span class="swatch"></span> Dias já bloqueados</p>
  }
</div>
