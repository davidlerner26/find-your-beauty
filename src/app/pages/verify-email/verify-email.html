<main class="verify">
  <h1 i18n>Verifique o seu e-mail</h1>
  <p i18n class="subtitle">
    Digite o código de 4 números que enviamos para <strong>{{ email() }}</strong
    >.
  </p>

  <div class="boxes">
    @for (index of boxes; track index) {
      <input
        #box
        class="box"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="4"
        [attr.aria-label]="t.digit(index + 1)"
        [class.filled]="digits()[index]"
        (input)="onInput(index, $event)"
        (keydown)="onKeydown(index, $event)"
        (paste)="onPaste($event)"
      />
    }
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (notice()) {
    <p class="notice" role="status">{{ notice() }}</p>
  }

  <p i18n class="resend">
    @if (wait() > 0) {
      Reenviar em <strong>{{ clock() }}</strong>
    } @else {
      <button type="button" class="link" (click)="resend()">Reenviar código</button>
    }
  </p>

  <button
    i18n
    type="button"
    class="primary"
    [disabled]="!complete() || submitting()"
    (click)="submit()"
  >
    @if (submitting()) {
      Verificando...
    } @else {
      Verificar e-mail
    }
  </button>

  <p class="back"><a i18n routerLink="/entrar">Voltar ao login</a></p>
</main>
