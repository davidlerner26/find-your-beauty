<main class="verify">
  <h1>Verifique o seu e-mail</h1>
  <p class="subtitle">Digite o código de 4 números que enviamos para <strong>{{ email() }}</strong>.</p>

  <div class="boxes">
    @for (index of boxes; track index) {
      <input
        #box
        class="box"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="4"
        [attr.aria-label]="'Número ' + (index + 1) + ' do código'"
        [class.filled]="digits()[index]"
        (input)="onInput(index, $event)"
        (keydown)="onKeydown(index, $event)"
        (paste)="onPaste($event)"
      />
    }
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (notice()) {
    <p class="notice" role="status">{{ notice() }}</p>
  }

  <p class="resend">
    @if (wait() > 0) {
      Reenviar em <strong>{{ clock() }}</strong>
    } @else {
      <button type="button" class="link" (click)="resend()">Reenviar código</button>
    }
  </p>

  <button type="button" class="primary" [disabled]="!complete() || submitting()" (click)="submit()">
    {{ submitting() ? 'Verificando...' : 'Verificar e-mail' }}
  </button>

  <p class="back"><a routerLink="/entrar">Voltar ao login</a></p>
</main>
