<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Find Your Beauty</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        text-align: center;
        color: #374555;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.6rem;
        border-radius: 999px;
        background: #374555;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Voltando para o aplicativo...</p>
      <a id="open" href="findyourbeauty://pro/instagram">Abrir o aplicativo</a>
    </main>
    <script>
      // The return address of Instagram for the mobile app: Instagram only accepts https addresses, so it comes here
      // with ?code=...&state=... (or ?error=...) and this page hands the same query to the app.
      var target = 'findyourbeauty://pro/instagram' + window.location.search;
      document.getElementById('open').href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
